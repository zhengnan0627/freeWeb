<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Agent Pet · 交互演示</title>
<style>
  :root{
    /* 容器 = 角色实际尺寸（命中区精准，不再有空边） */
    --pet-w: 96px;
    --pet-h: calc(var(--pet-w) * 1.5257);   /* 角色宽高比 118:180 */
    --cell: calc(var(--pet-w) / 0.4609);    /* 逻辑格：让角色正好等于 --pet-w */
    --cols: 8;
    --rows: 5;
    --brand: #3b82f6;
    --brand-2: #60a5fa;
    --ink: #1f2937;
    --muted: #6b7280;
    --line: #e5e7eb;
    --panel: #ffffff;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;}
  body{
    font:14px/1.6 "PingFang SC","Microsoft YaHei",system-ui,-apple-system,sans-serif;
    color:var(--ink);
    background:#f3f6fb;
    overflow:hidden;
    user-select:none;
  }

  /* ---------- 模拟系统页面 ---------- */
  .page{
    position:absolute;inset:0;
    background:
      radial-gradient(900px 500px at 20% -10%, rgba(59,130,246,.10), transparent 60%),
      linear-gradient(180deg,#f7f9fd,#eef3fb);
  }
  .topbar{
    height:56px;background:#fff;border-bottom:1px solid var(--line);
    display:flex;align-items:center;padding:0 24px;gap:10px;
    box-shadow:0 1px 3px rgba(16,24,40,.04);
  }
  .dot{width:10px;height:10px;border-radius:50%;background:#dbeafe;}
  .dot:nth-child(2){background:#bfdbfe;}
  .dot:nth-child(3){background:#93c5fd;}
  .topbar b{margin-left:8px;font-weight:600;color:#374151;}
  .ghost{margin-left:auto;color:#9ca3af;font-size:12.5px;}
  .content{padding:40px 48px;max-width:760px;}
  .content h2{font-size:19px;margin:0 0 10px;color:#111827;}
  .content p{color:var(--muted);margin:0 0 14px;}
  .card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px 20px;box-shadow:0 6px 20px rgba(16,24,40,.04);}
  .card + .card{margin-top:16px;}
  .k{color:#9ca3af;font-size:12px;}
  .v{font-weight:600;}

  /* ---------- Pet ---------- */
  .agent-pet{
    position:fixed; left:0; top:0;
    width:var(--pet-w);
    height:var(--pet-h);
    z-index:9999;
    touch-action:none;
    transition: filter .2s;
  }
  .agent-pet.dragging{ cursor:grabbing; filter:drop-shadow(0 14px 22px rgba(16,24,40,.22)); }
  .agent-pet:not(.dragging){ cursor:grab; }

  .pet{
    position:absolute;
    width:var(--cell);
    height:var(--cell);
    left:calc(var(--cell) * -0.2695);
    top:calc(var(--cell) * -0.2578);
    background-image:url("./agent-pet.webp");
    background-repeat:no-repeat;
    background-size:calc(var(--cell) * var(--cols)) calc(var(--cell) * var(--rows));
    background-position-x:0;
    background-position-y:calc(var(--cell) * var(--row,0) * -1);
    pointer-events:none;
  }
  .pet[data-state="idle"]   { --row:0; animation:playIdle    2.4s steps(8) infinite; }
  .pet[data-state="running"]{ --row:1; animation:playRunning 1.2s steps(8) infinite; }
  .pet[data-state="done"]   { --row:2; animation:playDone    0.9s steps(6) infinite; }
  .pet[data-state="error"]  { --row:3; animation:playError   1.0s steps(6) infinite; }
  .pet[data-state="climb"]  { --row:4; animation:playClimb   1.6s steps(4) infinite; }

  /* 贴边时：鼠标移开 → 暂停；悬停 → 恢复播放 */
  .agent-pet.docked:not(:hover) .pet{ animation-play-state:paused; }

  @keyframes playIdle    { from{background-position-x:0;} to{background-position-x:calc(var(--cell) * -8);} }
  @keyframes playRunning { from{background-position-x:0;} to{background-position-x:calc(var(--cell) * -8);} }
  @keyframes playDone    { from{background-position-x:0;} to{background-position-x:calc(var(--cell) * -6);} }
  @keyframes playError   { from{background-position-x:0;} to{background-position-x:calc(var(--cell) * -6);} }
  @keyframes playClimb   { from{background-position-x:0;} to{background-position-x:calc(var(--cell) * -4);} }

  /* 思考光点：CSS 实现，颜色可控，白底也清楚 */
  .think-dots{
    position:absolute;
    left:50%;
    top:-15px;
    transform:translateX(-50%);
    display:none;
    gap:calc(var(--cell) * 0.039);
    align-items:center;
    pointer-events:none;
  }
  .agent-pet[data-state="running"] .think-dots{ display:flex; }
  .think-dots i{
    width:calc(var(--cell) * 0.055);
    height:calc(var(--cell) * 0.055);
    border-radius:50%;
    background:#f59e0b;
    box-shadow:0 0 0 2px #fff, 0 2px 5px rgba(0,0,0,.18);
    animation:dotPulse 1.2s ease-in-out infinite;
  }
  .think-dots i:nth-child(2){ animation-delay:.18s; }
  .think-dots i:nth-child(3){ animation-delay:.36s; }
  @keyframes dotPulse{
    0%,70%,100%{ opacity:.28; transform:scale(.75); }
    30%{ opacity:1; transform:scale(1.15); }
  }

  /* climb 素材右对齐（bbox x 137~256），单独把它对齐到容器左边缘 */
  .pet[data-state="climb"]{ left:calc(var(--cell) * -0.535); }
  .agent-pet.dock-left .pet[data-state="climb"]{ left:0; }

  /* 完全贴边：不隐藏。素材右边缘就是抓握的手，正好衔接到屏幕边缘 */
  .agent-pet.dock-right{ transform:none; }
  .agent-pet.dock-left { transform:none; }
  .agent-pet.dock-left .pet{ transform:scaleX(-1); }
  .agent-pet.docked{ transition: transform .25s cubic-bezier(.2,.8,.2,1); }
  .agent-pet.dock-right.docked:hover{ transform:translateX(-4px); }
  .agent-pet.dock-left.docked:hover{ transform:translateX(4px); }

  /* ---------- 气泡 ---------- */
  .bubble{
    position:absolute;
    max-width:min(320px, 78vw);
    min-width:150px;
    background:#fff;
    border:1px solid #dbeafe;
    border-radius:14px;
    padding:12px 14px 12px;
    box-shadow:0 12px 32px rgba(16,24,40,.14);
    opacity:0; transform:scale(.92); pointer-events:none;
    transition:opacity .18s, transform .18s;
    color:#1f2937;
    font-size:13.5px;
    line-height:1.55;
  }
  .bubble.show{ opacity:1; transform:scale(1); pointer-events:auto; }

  /* 气泡贴角色头顶 / 脚底（容器即角色，无需再补偏移） */
  .bubble.dir-top{ bottom:calc(100% + 10px); }
  .bubble.dir-bottom{ top:calc(100% + 10px); }
  .bubble.align-left{ left:0; }
  .bubble.align-right{ right:0; }

  /* 小三角 */
  .bubble::after{
    content:"";position:absolute;width:12px;height:12px;background:#fff;
    border-right:1px solid #dbeafe;border-bottom:1px solid #dbeafe;
    transform:rotate(45deg);
  }
  /* 三角跟随气泡底色（只有 right/bottom 两条边有 border，border-color 简写安全） */
  .bubble.type-result::after{ background:#f0fdf4; border-color:#bbf7d0; }
  .bubble.type-error::after{ background:#fef2f2; border-color:#fecaca; }
  .bubble.dir-top::after{ bottom:-7px; }
  .bubble.dir-bottom::after{ top:-7px; transform:rotate(-135deg); }
  .bubble.dir-top.align-left::after{ left:26px; }
  .bubble.dir-top.align-right::after{ right:26px; }
  .bubble.dir-bottom.align-left::after{ left:26px; }
  .bubble.dir-bottom.align-right::after{ right:26px; }

  .bubble-title{font-weight:600;margin-bottom:4px;color:#111827;}
  .bubble-close{
    position:absolute;right:6px;top:4px;border:0;background:transparent;
    color:#9ca3af;cursor:pointer;font-size:15px;line-height:1;padding:4px;
    border-radius:6px;
  }
  .bubble-close:hover{background:#f3f4f6;color:#6b7280;}
  .bubble-actions{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;}
  .bubble-actions button{
    font:inherit;font-size:12.5px;padding:6px 14px;border-radius:8px;
    border:1px solid transparent;cursor:pointer;transition:.15s;
  }
  .btn-primary{background:linear-gradient(135deg,#3b82f6,#6366f1);color:#fff;box-shadow:0 4px 12px rgba(59,130,246,.28);}
  .btn-primary:hover{transform:translateY(-1px);}
  .btn-ghost{background:#f3f4f6;color:#4b5563;}
  .btn-ghost:hover{background:#e5e7eb;}

  .bubble.type-result{border-color:#bbf7d0;background:#f0fdf4;}
  .bubble.type-result .bubble-title{color:#15803d;}
  .bubble.type-error{border-color:#fecaca;background:#fef2f2;}
  .bubble.type-error .bubble-title{color:#b91c1c;}

  /* ---------- 红点 ---------- */
  .badge{
    position:absolute;
    top:-7px;
    right:-7px;
    min-width:calc(var(--cell) * 0.14);
    height:calc(var(--cell) * 0.14);
    padding:0 calc(var(--cell) * 0.04);
    border-radius:calc(var(--cell) * 0.07);
    background:#ef4444;color:#fff;
    font-size:calc(var(--cell) * 0.086);
    line-height:calc(var(--cell) * 0.14);
    text-align:center;font-weight:700;
    border:2px solid #fff;box-shadow:0 2px 6px rgba(239,68,68,.4);
    opacity:0;transform:scale(.6);transition:.18s;
  }
  .badge.show{opacity:1;transform:scale(1);}

  /* ---------- 控制面板 ---------- */
  .panel{
    position:fixed;left:50%;bottom:20px;transform:translateX(-50%);
    display:flex;gap:8px;flex-wrap:wrap;justify-content:center;
    background:rgba(255,255,255,.9);backdrop-filter:blur(8px);
    border:1px solid var(--line);border-radius:999px;
    padding:8px 12px;box-shadow:0 10px 30px rgba(16,24,40,.10);
    z-index:10000;max-width:min(760px,92vw);
  }
  .panel button{
    font:inherit;font-size:12.5px;padding:7px 13px;border-radius:999px;
    border:1px solid var(--line);background:#fff;color:#374151;cursor:pointer;transition:.15s;
  }
  .panel button:hover{border-color:#93c5fd;color:#1d4ed8;}
  .panel .sep{width:1px;background:var(--line);margin:2px 2px;}
  .panel .lbl{font-size:12px;color:#9ca3af;display:flex;align-items:center;padding:0 4px;}
</style>
</head>
<body>

<div class="page">
  <div class="topbar">
    <span class="dot"></span><span class="dot"></span><span class="dot"></span>
    <b>护理文书系统</b>
    <span class="ghost">模拟页面 · 拖动右下角的小龙试试</span>
  </div>
  <div class="content">
    <h2>患者详情 / 护理评估</h2>
    <p>这是用来演示 Pet 交互的模拟界面。把 Pet 拖到不同位置，气泡会自动换方向；拖到屏幕边缘会"扒"在边上。</p>
    <div class="card">
      <div class="k">当前状态</div>
      <div class="v" id="stateLabel">idle</div>
    </div>
    <div class="card">
      <div class="k">未读提醒</div>
      <div class="v" id="badgeLabel">0</div>
    </div>
  </div>
</div>

<!-- Pet -->
<div class="agent-pet" id="petRoot">
  <div class="bubble" id="bubble">
    <button class="bubble-close" id="bubbleClose" title="关闭">×</button>
    <div class="bubble-title" id="bubbleTitle"></div>
    <div id="bubbleText"></div>
    <div class="bubble-actions" id="bubbleActions"></div>
  </div>
  <div class="pet" id="pet" data-state="idle"></div>
  <span class="think-dots"><i></i><i></i><i></i></span>
  <div class="badge" id="badge">0</div>
</div>

<!-- 演示控制台 -->
<div class="panel">
  <span class="lbl">触发：</span>
  <button data-trigger="ask">询问预填</button>
  <button data-trigger="multi">多规则(测优先级)</button>
  <div class="sep"></div>
  <span class="lbl">状态：</span>
  <button data-state="idle">待机</button>
  <button data-state="running">运行</button>
  <button data-state="done">完成</button>
  <button data-state="error">失败</button>
  <div class="sep"></div>
  <button id="resetPos">复位位置</button>
  <button id="clearBadge">清红点</button>
</div>

<script>
(function(){
  const root = document.getElementById('petRoot');
  const pet = document.getElementById('pet');
  const bubble = document.getElementById('bubble');
  const bubbleTitle = document.getElementById('bubbleTitle');
  const bubbleText = document.getElementById('bubbleText');
  const bubbleActions = document.getElementById('bubbleActions');
  const bubbleClose = document.getElementById('bubbleClose');
  const badge = document.getElementById('badge');
  const stateLabel = document.getElementById('stateLabel');
  const badgeLabel = document.getElementById('badgeLabel');

  const CELL = 96;            // 容器宽度（= 角色宽）
  const PET_H = 147;          // 容器高度（= 角色高）
  const MARGIN = 8;
  const STORE_KEY = 'agent-pet-pos-v1';

  let state = 'idle';
  let unread = 0;
  let pos = { x: window.innerWidth - CELL - 28, y: window.innerHeight - CELL - 92 };
  let docked = null;              // null | 'left' | 'right'
  let bubbleData = null;

  /* ============ 位置 ============ */
  function applyPos(){
    root.style.left = pos.x + 'px';
    root.style.top = pos.y + 'px';
  }
  function savePos(){
    try{ localStorage.setItem(STORE_KEY, JSON.stringify(pos)); }catch(e){}
  }
  function loadPos(){
    try{
      const s = localStorage.getItem(STORE_KEY);
      if(s){
        const p = JSON.parse(s);
        if(typeof p.x === 'number' && typeof p.y === 'number'){ pos = p; }
      }
    }catch(e){}
    clamp();
  }
  function clamp(){
    const maxX = window.innerWidth - CELL - MARGIN;
    const maxY = window.innerHeight - PET_H - MARGIN;
    pos.x = Math.max(MARGIN, Math.min(maxX, pos.x));
    pos.y = Math.max(MARGIN, Math.min(maxY, pos.y));
  }

  /* ============ 气泡方向 ============ */
  function updateBubbleDir(){
    const cx = pos.x + CELL / 2;
    const cy = pos.y + PET_H / 2;
    const dirTop = cy > window.innerHeight / 2;   // pet 在下半屏 → 气泡在上
    const alignRight = cx > window.innerWidth / 2; // pet 在右半屏 → 气泡右对齐
    bubble.classList.toggle('dir-top', dirTop);
    bubble.classList.toggle('dir-bottom', !dirTop);
    bubble.classList.toggle('align-right', alignRight);
    bubble.classList.toggle('align-left', !alignRight);
  }

  /* ============ 状态 ============ */
  function setState(s){
    state = s;
    pet.style.animation = 'none';
    void pet.offsetWidth;
    pet.dataset.state = s;
    root.dataset.state = s;   // 供 think-dots 等外层选择器使用
    pet.style.animation = '';
    stateLabel.textContent = s;
    if(s === 'climb' && !docked) docked = 'right';
    if(s !== 'climb' && docked) { /* 保持 dock 视觉，但状态可换 */ }
  }

  /* ============ 气泡 ============ */
  function showBubble(data){
    bubbleData = data;
    bubble.className = 'bubble show ' + (data.type === 'result' ? 'type-result' : data.type === 'error' ? 'type-error' : '');
    updateBubbleDir();
    bubbleTitle.textContent = data.title || '';
    bubbleTitle.style.display = data.title ? '' : 'none';
    bubbleText.textContent = data.text || '';
    bubbleActions.innerHTML = '';

    (data.actions || []).forEach(a => {
      const b = document.createElement('button');
      b.className = a.primary === false ? 'btn-ghost' : 'btn-primary';
      b.textContent = a.label;
      b.onclick = (e) => {
        e.stopPropagation();
        hideBubble();
        if(a.value === 'start'){
          setState('running');
          // 模拟任务：2.4s 后完成
          setTimeout(()=>{
            setState('done');
            showBubble({ type:'result', title:'预填完成', text:'已为你填入 12 项评估内容，可点击查看。' });
            autoHide(3200);
          }, 2400);
        }else if(a.value === 'retry'){
          setState('running');
          setTimeout(()=>{ setState('error'); showBubble({type:'error',title:'仍失败',text:'请检查网络后重试。',actions:[{label:'重试',value:'retry'}]}); }, 1500);
        }
      };
      bubbleActions.appendChild(b);
    });

    if(data.autoHide) autoHide(data.autoHide);
  }

  let hideTimer = null;
  function autoHide(ms){
    clearTimeout(hideTimer);
    hideTimer = setTimeout(hideBubble, ms);
  }
  function hideBubble(){
    clearTimeout(hideTimer);
    bubble.classList.remove('show');
    bubbleData = null;
  }
  bubbleClose.onclick = (e)=>{ e.stopPropagation(); hideBubble(); };

  /* ============ 红点 ============ */
  function setUnread(n){
    unread = n;
    badge.textContent = n > 9 ? '9+' : String(n);
    badge.classList.toggle('show', n > 0);
    badgeLabel.textContent = n;
  }

  /* ============ 触发器（模拟业务 hook 的判定结果）============ */
  const RULES = [
    { id:'barthel-unfilled', priority: 10, type:'ask',
      title:'护理评估', text:'需要我帮你进行 Barthel 评估单预填吗？',
      actions:[{label:'点击继续', value:'start'}, {label:'暂不需要', value:'skip', primary:false}] },
    { id:'overdue-sheets', priority: 6, type:'hint',
      text:'你有 3 份护理文书超过 24 小时未提交。', autoHide: 4000 },
    { id:'vte-due', priority: 3, type:'hint',
      text:'今日还有 1 位患者的 VTE 评估待完成。', autoHide: 4000 }
  ];

  function fireTriggers(list){
    if(!list.length) return;
    // 按优先级降序
    const sorted = [...list].sort((a,b)=> (b.priority||0) - (a.priority||0));
    const top = sorted[0];
    const rest = sorted.slice(1);

    showBubble({
      type: top.type || 'hint',
      title: top.title,
      text: top.text,
      actions: top.actions,
      autoHide: top.autoHide && !top.actions ? top.autoHide : null
    });

    // 其余进红点
    if(rest.length) setUnread(unread + rest.length);
  }

  /* ============ 拖拽 ============ */
  let down = false, dragging = false;
  let startX = 0, startY = 0, originX = 0, originY = 0;

  root.addEventListener('pointerdown', (e)=>{
    if(e.target.closest('.bubble')) return;   // 气泡内不触发拖拽
    down = true; dragging = false;
    startX = e.clientX; startY = e.clientY;
    originX = pos.x; originY = pos.y;
    root.setPointerCapture(e.pointerId);
  });

  root.addEventListener('pointermove', (e)=>{
    if(!down) return;
    const dx = e.clientX - startX;
    const dy = e.clientY - startY;

    if(!dragging && Math.hypot(dx, dy) > 5){
      dragging = true;
      root.classList.add('dragging');
      // 开始拖拽时，先从收起态弹出
      if(docked){ undock(); }
    }
    if(dragging){
      pos.x = Math.max(-CELL*0.6, Math.min(window.innerWidth - CELL*0.4, originX + dx));
      pos.y = Math.max(-PET_H*0.2, Math.min(window.innerHeight - PET_H*0.4, originY + dy));
      applyPos();
      updateBubbleDir();
    }
  });

  root.addEventListener('pointerup', (e)=>{
    if(!down) return;
    down = false;
    root.classList.remove('dragging');

    if(dragging){
      dragging = false;
      maybeDock();
      savePos();
    }else{
      // 点击（移动 < 5px）
      onPetClick();
    }
  });

  function undock(){
    docked = null;
    root.classList.remove('dock-left','dock-right','docked');
    clamp(); applyPos();
  }

  function maybeDock(){
    const cx = pos.x + CELL/2;
    if(cx > window.innerWidth - CELL*0.28){
      // 拖到右侧外
      docked = 'right';
      pos.x = window.innerWidth - CELL;
      root.classList.add('docked','dock-right');
      root.classList.remove('dock-left');
      applyPos();
      setState('climb');
    }else if(cx < CELL*0.28){
      docked = 'left';
      pos.x = 0;
      root.classList.add('docked','dock-left');
      root.classList.remove('dock-right');
      applyPos();
      setState('climb');
    }else{
      undock();
      if(state === 'climb') setState('idle');
    }
    updateBubbleDir();
  }

  function onPetClick(){
    if(docked){
      // 点一下从墙边弹出来
      undock();
      setState('idle');
      return;
    }
    // 清红点 + 弹最新消息
    if(unread > 0){
      setUnread(0);
      showBubble({ type:'hint', text:'已为你清空提醒。', autoHide: 1800 });
    }else{
      showBubble({ type:'hint', text:'我在～ 需要帮忙随时点我。', autoHide: 1600 });
    }
  }

  /* ============ 控制台 ============ */
  document.querySelector('.panel').addEventListener('click', (e)=>{
    const btn = e.target.closest('button');
    if(!btn) return;

    if(btn.dataset.trigger === 'ask'){
      fireTriggers([RULES[0]]);
    }else if(btn.dataset.trigger === 'multi'){
      fireTriggers(RULES);   // 三条一起，只弹优先级最高的，其余进红点
    }else if(btn.dataset.state){
      let s = btn.dataset.state;
      if(docked) undock();
      setState(s);
      if(s === 'done'){
        setTimeout(()=>{ showBubble({type:'result',title:'已完成',text:'评估单预填完成。'}); autoHide(3000); }, 600);
      }
      if(s === 'error'){
        setTimeout(()=>{ showBubble({type:'error',title:'出错了',text:'接口返回异常，请稍后重试。',actions:[{label:'重试',value:'retry'}]}); }, 600);
      }
    }else if(btn.id === 'resetPos'){
      undock();
      pos = { x: window.innerWidth - CELL - 28, y: window.innerHeight - PET_H - 92 };
      applyPos(); updateBubbleDir(); savePos();
    }else if(btn.id === 'clearBadge'){
      setUnread(0);
    }
  });

  /* ============ 初始化 ============ */
  loadPos();
  applyPos();
  updateBubbleDir();
  setState('idle');
  setUnread(0);

  window.addEventListener('resize', ()=>{
    if(docked){
      pos.x = docked === 'right' ? window.innerWidth - CELL : 0;
    }else{
      clamp();
    }
    applyPos();
    updateBubbleDir();
  });

  // 首次进入延迟 1.2s 模拟 hook 查询后触发
  setTimeout(()=>fireTriggers([RULES[0]]), 1200);
})();
</script>
</body>
</html>
